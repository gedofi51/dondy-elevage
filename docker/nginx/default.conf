# Reverse proxy minimal pour le développement local.
# / -> web (Next.js), /api/ -> api (NestJS, déjà préfixé /api/v1 côté Nest).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Résolveur DNS interne Docker : force la résolution des upstreams via une
    # variable (ci-dessous) plutôt qu'au chargement de la config. Nécessaire
    # en mode hybride Windows (voir CLAUDE.md) où le conteneur "web" ne
    # tourne jamais : sans ceci, nginx refuse de démarrer ("host not found
    # in upstream") dès que "web" est absent, cassant aussi /api/ au passage.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
