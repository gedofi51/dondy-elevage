name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un pipeline en échec bloque le déploiement (voir CLAUDE.md, Git / CI-CD).
# Le déploiement lui-même (image Docker, publication) est ajouté à partir de
# la phase où un environnement de déploiement réel existe.

env:
  # Utilisée à la fois comme placeholder syntaxique pour `prisma generate`
  # (postinstall de apps/api, ne se connecte à rien) et comme connexion
  # réelle des étapes de migration/seed/e2e ci-dessous — les identifiants
  # correspondent volontairement au service "mysql" déclaré plus bas.
  DATABASE_URL: 'mysql://ci:ci@localhost:3306/ci'
  # Secrets CI éphémères, sans lien avec un environnement réel : uniquement
  # utilisés pour signer des jetons pendant la durée d'un run de pipeline.
  JWT_ACCESS_SECRET: 'ci-only-access-secret-ephemere'
  JWT_REFRESH_SECRET: 'ci-only-refresh-secret-ephemere'
  TWO_FACTOR_CHALLENGE_SECRET: 'ci-only-2fa-secret-ephemere'

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (environnement de test Vitest de apps/web) exige
          # explicitement Node >=22.22, >=24.15 ou >=26 (voir son champ
          # engines) : en dessous, node:worker_threads.markAsUncloneable
          # n'existe pas, ce qu'undici >=8.0.3 (dépendance de jsdom)
          # appelle désormais sans probe de compatibilité, d'où
          # "TypeError: webidl.util.markAsUncloneable is not a function"
          # au démarrage de CacheStorage. Alignée sur la version utilisée
          # en local (24.18.0).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages/shared-types
        # Étape de build ajoutée en Phase 9 (nécessaire pour que apps/api
        # résolve ses types en CommonJS — voir DETTE_TECHNIQUE.md, Phase 9).
        # `npm ci` seul ne suffit plus : sans ce build, apps/api/src/common/
        # rbac/permissions.constants.ts (ré-export) résout PERMISSIONS en
        # `any`, faisant échouer le lint (règles no-unsafe-*) uniquement sur
        # un checkout propre (jamais en local, où dist/ traîne déjà).
        run: npm run build --workspace=packages/shared-types

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Prisma - appliquer les migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Prisma - seed rôles/permissions (référentiel RBAC requis par les tests e2e)
        run: npm run db:seed
        working-directory: apps/api

      - name: Tests e2e (auth, RBAC, isolation farmId)
        run: npm run test:e2e --workspace=apps/api

      - name: Build
        run: npm run build
